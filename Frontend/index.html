<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon Guard Cybersecurity Suite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Dragon Guard Suite</h1>

  <div class="dashboard-grid">
    <div class="card">
      <h3>System Status</h3>
      <div class="input-group">
        <button id="check-btn">Check Health</button>
      </div>
      <p id="status-output">System idle...</p>
    </div>

    <div class="card">
      <h3>1. Password Strength</h3>
      <div class="input-group">
        <input type="password" id="pass-input" placeholder="Enter password...">
        <button id="pass-btn">Analyze</button>
      </div>
      <p id="pass-output"></p>
    </div>

    <div class="card">
      <h3>2. Header Inspector</h3>
      <div class="input-group">
        <input type="text" id="header-input" placeholder="example.com">
        <button id="header-btn">Scan</button>
      </div>
      <pre id="header-output">Awaiting scan...</pre>
    </div>

    <div class="card">
      <h3>3. Threat Scanner</h3>
      <div class="input-group">
        <input type="text" id="url-input" placeholder="Enter target URL...">
        <button id="url-btn">Scan</button>
      </div>
      <pre id="url-output">Awaiting scan...</pre>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
